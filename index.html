<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CheckerCC</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#f8fafc;
    --bg-card:#ffffff;
    --fg:#0f172a;
    --muted:#64748b;
    --accent:#0ea5e9;
    --accent-glow:rgba(14,165,233,.2);
    --danger:#ef4444;
    --radius:12px;
    --font:'SF Pro','Segoe UI',system-ui,-apple-system,sans-serif
  }
  html,body{height:100%}
  body{
    font-family:var(--font);background:var(--bg);color:var(--fg);
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    display:flex;flex-direction:column;min-height:100vh;padding:20px;gap:16px
  }
  .container{max-width:560px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px}
  .logo-skull{text-align:center;padding:8px 0 6px}
  .logo-skull svg{width:48px;height:48px}
  h1{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;text-align:center;padding:4px 0 2px;color:var(--fg)}
  .section{background:var(--bg-card);border-radius:var(--radius);padding:20px;border:1px solid rgba(0,0,0,.06);box-shadow:0 4px 16px rgba(0,0,0,.04)}
  label{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;display:block}
  textarea{
    width:100%;background:rgba(0,0,0,.04);border:1px solid rgba(0,0,0,.08);
    border-radius:8px;padding:14px;font-size:.85rem;color:var(--fg);
    font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
    resize:vertical;outline:none;transition:border-color .2s
  }
  textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
  textarea{min-height:140px;max-height:280px}
  .btn-group{display:flex;gap:12px}
  button{
    flex:1;padding:14px 20px;border-radius:8px;font-size:.9rem;font-weight:600;
    cursor:pointer;border:none;transition:all .18s;text-transform:uppercase;letter-spacing:.04em
  }
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:#0284c7}
  .btn-primary:active{transform:scale(.97)}
  .btn-stop{background:var(--danger);color:#fff}
  .btn-stop:hover{background:#dc2626}
  .btn-stop:active{transform:scale(.97)}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}
  .results{max-height:280px;overflow-y:auto;font-size:.8rem;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;line-height:1.5;padding:12px;border-radius:8px;background:rgba(0,0,0,.03);border:1px solid rgba(0,0,0,.04)}
  .result-item{padding:8px 12px;border-radius:6px;margin-bottom:6px;border-left:3px solid var(--muted);background:rgba(0,0,0,.02)}
  .result-item.live{border-left-color:var(--accent);background:rgba(14,165,233,.08)}
  .live-badge{cursor:pointer;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px}
  .status{font-size:.75rem;color:var(--muted);text-align:center;padding:6px}
  .footer{margin-top:auto;padding:16px;text-align:center;font-size:.7rem;color:var(--muted);border-top:1px solid rgba(0,0,0,.04)}
  .footer .team{color:var(--accent);font-weight:700;font-size:.8rem}
  ::-webkit-scrollbar{width:6px}
  ::-webkit-scrollbar-thumb{background:var(--muted);border-radius:6px}
  @media(max-width:380px){.btn{padding:12px 16px;font-size:.85rem}}
</style>
</head>
<body>
<div class="container">
  <div class="logo-skull">
    <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2c-4.97 0-9 3.582-9 8 0 5.523 4.477 9 9 9s9-3.477 9-9c0-4.418-4.03-8-9-8z"/>
      <path d="M9.5 11.5a2.5 2.5 0 010 5M14.5 11.5a2.5 2.5 0 010 5"/>
      <path d="M9 18v2m6-2v2"/>
      <path d="M9 3v2m6-2v2"/>
      <path d="M3 12h2m14 0h2"/>
      <path d="M4.2 4.2l1.4 1.4m12 0l1.4-1.4M5.6 19.8l1.4-1.4m12 0l1.4 1.4"/>
    </svg>
  </div>
  <h1>CHECKER — PAREJAO</h1>
  
  <div class="section">
    <label>Cartões (1 por linha — até 20)</label>
    <textarea id="cardsInput" placeholder="Formato: numero|mes|ano|cvv
Exemplo:
4242424242424242|12|2025|123"></textarea>
  </div>
  
  <div class="section">
    <label>Checker GG (CC test — até 20)</label>
    <textarea id="ggTest" placeholder="Formato: numero|mes|ano|cvv
Exemplo:
4242424242424242|12|2025|123"></textarea>
  </div>
  
  <div class="btn-group">
    <button class="btn btn-primary" id="btnStart" onclick="startCheck()">Iniciar</button>
    <button class="btn btn-stop" id="btnStop" onclick="stopCheck()" disabled>Parar</button>
  </div>
  
  <div class="status" id="status">Pronto — insira até 20 cards</div>
  
  <div class="section">
    <label>Resultados</label>
    <div class="results" id="results">Nenhum resultado ainda.</div>
  </div>
  
  <div class="footer">
    <span class="team">CyberHaxor Team</span>
  </div>
</div>
 
<script>
const API_URL = 'checker.php?action=check';
const STRIPE_PK = 'pk_live_51TrmHoLJuAfa1w8I3yQ5RB0K46lz4VMOdCJRQRb1oy9Z9PwA5jBa8OQbZDetU5SJUMa6zqIzR57Kg7wx24msCCnn00yHqpN4St';
let isRunning = false;
let processedCount = 0;
  
function parseCards(text) {
  return text.split('\n')
    .map(l => l.trim())
    .filter(l => l.length > 0)
    .slice(0, 20);
}
  
function addResult(text, isLive = false) {
  const box = document.getElementById('results');
  const div = document.createElement('div');
  div.className = 'result-item' + (isLive ? ' live' : '');
  if (isLive) {
    div.innerHTML = text.replace(/parejao/gi, '<a class="live-badge" href="https://t.me/parejao" target="_blank" rel="noopener">parejao</a>');
  } else {
    div.textContent = text;
  }
  if (box.firstChild && box.firstChild.textContent === 'Nenhum resultado ainda.') box.innerHTML = '';
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}
  
async function checkCard(cardLine) {
  try {
    const r = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ card_line: cardLine })
    });
    return await r.json();
  } catch (err) {
    return { ok: false, msg: err.message || 'Erro de rede' };
  }
}
  
async function processList(cards) {
  isRunning = true;
  processedCount = 0;
  document.getElementById('btnStart').disabled = true;
  document.getElementById('btnStop').disabled = false;
  document.getElementById('status').textContent = 'Processando... 0/' + cards.length;
 
  for (let i = 0; i < cards.length && isRunning; i++) {
    const line = cards[i].trim();
    if (!line) continue;
    const res = await checkCard(line);
    processedCount = i + 1;
    document.getElementById('status').textContent = 'Processando... ' + processedCount + '/' + cards.length;
    if (res.ok) {
      addResult(line + ' ====> LIVE BY PAREJAO', true);
    } else {
      addResult(line + ' — ' + res.msg);
    }
    await new Promise(r => setTimeout(r, 800 + Math.random() * 700));
  }
 
  isRunning = false;
  document.getElementById('btnStart').disabled = false;
  document.getElementById('btnStop').disabled = true;
  document.getElementById('status').textContent = 'Concluído — ' + processedCount + '/' + cards.length + ' processados';
}
  
function startCheck() {
  if (isRunning) return;
  const raw = document.getElementById('cardsInput').value;
  const cards = parseCards(raw);
  if (cards.length === 0) {
    document.getElementById('status').textContent = 'Nenhum cartão válido';
    return;
  }
  document.getElementById('results').innerHTML = '';
  processList(cards);
}
  
function stopCheck() {
  isRunning = false;
  document.getElementById('btnStop').disabled = true;
  document.getElementById('status').textContent = 'Parado no último resultado (' + processedCount + ')';
}
  
document.getElementById('ggTest').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    if (!isRunning) {
      const raw = document.getElementById('cardsInput').value;
      const cards = parseCards(raw);
      if (cards.length > 0) {
        document.getElementById('results').innerHTML = '';
        processList(cards);
      }
    }
  }
});
</script>
</body>
</html>
